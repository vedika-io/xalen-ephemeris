name: CI

# Run on PRs and on pushes to the default branch. (A PR branch already gets a
# pull_request run, so we don't also trigger on every feature-branch push.)
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: every job only reads the repo (checkout, build,
# test, audit). Any scope not listed defaults to `none`.
permissions:
  contents: read

# Cancel superseded in-progress runs on the same ref — but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # fmt + clippy(-D warnings) + docs. Deterministic across platforms, so run once
  # on Linux. These are exactly the gates CONTRIBUTING.md / the PR checklist
  # promise. (dtolnay/rust-toolchain does not install clippy/rustfmt by default.)
  lint:
    name: Format, Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy (warnings denied)
        run: cargo clippy --workspace --exclude xalen-python -- -D warnings
      - name: cargo doc
        run: cargo doc --no-deps --workspace --exclude xalen-python

  # The test suite across the platforms we ship for (N-API release triples + the
  # bug-report OS list cover Linux, macOS, Windows). fail-fast off so one OS's
  # failure doesn't mask the others. `xalen-python` is excluded because its PyO3
  # extension-module cdylib can't link as a plain `cargo test` binary on a runner
  # without libpython — it's covered by the `python-binding` job instead. This is
  # the same crate set as the workspace `default-members`.
  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude xalen-python

  # Required status check named "test" — this is the exact context the `main`
  # branch-protection rule requires. It is green only when `lint` and every leg
  # of `test-matrix` succeed, so it keeps the existing required check valid with
  # NO branch-protection change. (The heavier jobs below stay non-required /
  # informational, matching the prior gating where only "test" was required.)
  test:
    needs: [lint, test-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint + all test-matrix legs to pass
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "FAILED — lint=${{ needs.lint.result }} test-matrix=${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "All required gates passed."

  # External DE440 ephemeris validation. The `test-matrix` DE440 tests SKIP
  # because the kernel is not vendored (33 MB, gitignored); this job restores or
  # downloads the real NASA/NAIF DE440s SPK and runs the kernel-gated tests, so
  # the DE440 reader + apparent-place reduction are validated against the actual
  # ephemeris (and against committed JPL Horizons values) on every run.
  #
  # Scope note: de440s.bsp covers 1550–2650 CE (~33 MB), which spans all natal /
  # transit use. The long-span DE441 kernel (~3 GB) is impractical per-run;
  # validating against DE441 is a documented future step, not a per-run download.
  de440-validation:
    name: DE440 external cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cache the 33 MB kernel so we don't re-download from NAIF every run. The
      # tests read it from this exact path (DE440S_PATH in the test files).
      - name: Cache DE440s kernel
        id: de440-kernel
        uses: actions/cache@v4
        with:
          path: /tmp/de440s.bsp
          key: de440s-bsp-v1
      - name: Download DE440s ephemeris kernel (NASA/NAIF)
        if: steps.de440-kernel.outputs.cache-hit != 'true'
        run: curl -sSL --retry 3 -o /tmp/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
      - name: DE440 cross-validation (parser + apparent place vs JPL)
        run: cargo test -p xalen-ephem --test de440_real_crossval --test accuracy_vs_de440 -- --nocapture

  # Rust security scanning: cargo-audit checks Cargo.lock against the RustSec
  # advisory DB. Cargo.lock is gitignored, so generate one first (cargo-audit
  # errors without a lockfile). cargo-audit is installed as a prebuilt binary.
  audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Generate lockfile (Cargo.lock is gitignored)
        run: cargo generate-lockfile
      - run: cargo audit

  # WASM: wasm-pack runs wasm-bindgen and emits the JS/TS glue + .wasm that
  # crates/xalen-wasm/package.json ships. (A bare `cargo build --target wasm32`
  # only type-checks — the binding attributes are cfg(target_arch="wasm32")-gated
  # and the bindgen codegen step would be skipped.)
  wasm:
    name: WASM binding (wasm-pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: wasm-pack build
        working-directory: crates/xalen-wasm
        run: wasm-pack build --target web

  # Build the language bindings through their real toolchains so a broken binding
  # is caught — a plain `cargo build` produces neither the Python wheel, the
  # N-API .node addon, nor the wasm-bindgen glue.
  python-binding:
    name: Python binding (maturin / PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      # Run from the crate dir so maturin reads its pyproject.toml, which sets
      # features = ["extension-module"] for the wheel build.
      - name: maturin build
        working-directory: crates/xalen-python
        run: maturin build

  node-binding:
    name: Node binding (napi-rs / N-API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # crates/xalen-node has a committed package-lock.json, so `npm ci` installs
      # exactly the locked @napi-rs/cli. build:debug = `napi build --platform`; the
      # JS test loads the freshly built .node addon.
      - name: napi build + smoke test
        working-directory: crates/xalen-node
        run: |
          npm ci
          npm run build:debug
          npm test
