name: commercial-clean

# Proves that no published crate, built with its DEFAULT features, links the
# non-commercial Hipparcos data (ESA, CC BY-NC 3.0 IGO). That data lives only in
# the optional, unpublished `xalen-stars-hip-data` add-on crate. The default star
# list (`xalen-stars` BRIGHT_CATALOG) is built from the Yale Bright Star
# Catalogue and the IAU Catalog of Star Names. See NOTICE and
# crates/xalen-stars-hip-data.

on:
  push:
    branches: [main]
  pull_request:

# Read-only GITHUB_TOKEN: the job only checks out and inspects cargo trees.
permissions:
  contents: read

jobs:
  no-nc-data-in-published-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: No published crate depends on the NC data crate (default features)
        run: |
          set -euo pipefail
          fail=0
          # Every workspace package that may be published (publish is not false).
          pkgs=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish == null) | .name')
          test -n "$pkgs"
          for p in $pkgs; do
            n=$(cargo tree -p "$p" 2>/dev/null | grep -c 'xalen-stars-hip-data' || true)
            echo "$p (default features): xalen-stars-hip-data count = $n"
            if [ "$n" -ne 0 ]; then echo "::error::$p links the NC data crate"; fail=1; fi
          done
          # The add-on crate is a leaf: nothing in the workspace depends on it.
          rev=$(cargo tree --workspace -i xalen-stars-hip-data 2>/dev/null | grep -c 'xalen-stars-hip-data' || true)
          echo "reverse-dependency lines for xalen-stars-hip-data = $rev (1 = itself only)"
          if [ "$rev" -gt 1 ]; then echo "::error::a crate depends on the NC data crate"; fail=1; fi
          test "$fail" -eq 0

      - name: Published binding builds contain no Hipparcos symbols
        run: |
          set -euo pipefail
          cargo build -p xalen-ffi
          LIB=$(ls target/debug/libxalen_ffi.a target/debug/libxalen_ffi.so 2>/dev/null | head -1)
          echo "scanning $LIB"
          if nm "$LIB" 2>/dev/null | grep -iE 'GENERATED_CATALOG|stars_hip_data'; then
            echo "::error::NC HIP symbols found in the default binary"; exit 1
          fi
          if strings "$LIB" 2>/dev/null | grep -iE 'hip_main|Hipparcos Main Catalogue'; then
            echo "::error::NC catalogue marker strings found in the default binary"; exit 1
          fi
          echo "clean: no NC symbols/strings"

      - name: Default star list is present and the lookups work without defaults
        run: |
          set -euo pipefail
          cargo test -p xalen-stars
          cargo test -p xalen-stars --no-default-features
          cargo test -p xalen-ephem --no-default-features fixstar

      - name: Core sidereal output does not depend on the star catalogue
        run: |
          set -euo pipefail
          cargo test -p xalen-star-anchors
          cargo test -p xalen-ayanamsa
