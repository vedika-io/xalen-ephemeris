[package]
name = "xalen-validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reproducible accuracy validation runner — compares XALEN against a pyswisseph oracle file at any chart count"
publish = false

[[bin]]
name = "xalen-validation"
path = "src/main.rs"

# Ephemeris-precision benchmark: XALEN's DE440-backed apparent longitudes vs an
# independent reference (a JPL DE440/DE441 SPK kernel, and the analytic VSOP87
# baseline). Emits a per-body max/RMS deviation table in arcseconds.
#   cargo run -p xalen-validation --release --bin de440_bench
[[bin]]
name = "de440_bench"
path = "src/de440_bench.rs"

[dependencies]
xalen-time = { path = "../crates/xalen-time", version = "0.6.0" }
xalen-coords = { path = "../crates/xalen-coords", version = "0.6.0" }
xalen-ephem = { path = "../crates/xalen-ephem", version = "0.6.0" }
xalen-houses = { path = "../crates/xalen-houses", version = "0.6.0" }
xalen-ayanamsa = { path = "../crates/xalen-ayanamsa", version = "0.6.0" }
serde = { workspace = true }
serde_json = "1"

[lints]
workspace = true
