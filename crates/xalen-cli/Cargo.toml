[package]
name = "xalen-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The `xalen` command line: planetary positions, charts, panchang, dasha, eclipses and more from the XALEN Ephemeris"
keywords = ["ephemeris", "astrology", "jyotish", "cli", "astronomy"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "xalen"
path = "src/main.rs"

[dependencies]
xalen-ephemeris = { version = "0.7.0", path = "../.." }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
