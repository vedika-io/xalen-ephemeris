[package]
name = "xalen-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Non-Western/non-Chinese calendar and astrology systems — Mayan, Tibetan, Korean Saju, Japanese Nine Star Ki, Burmese Mahabote"
keywords = ["mayan", "tibetan", "saju", "nine-star-ki", "astrology"]
categories = ["science", "mathematics"]

[dependencies]
serde.workspace = true
# Reused for the Saju Ipchun (Li Chun) solar-year boundary and the Daeun
# solar-term distance — Korean Saju shares the Chinese solar-term machinery
# (only the stem/branch names differ). See `xalen_chinese::li_chun_jd`,
# `solar_longitude_approx`. Pulling the published implementation keeps Saju and
# BaZi astronomically consistent rather than re-deriving (and drifting from) the
# same ephemeris approximation.
xalen-chinese = { version = "0.6.0", path = "../xalen-chinese" }

[lints]
workspace = true
