[package]
name = "xalen-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for XALEN Ephemeris — run in any browser or Node.js"
keywords = ["wasm", "ephemeris", "astrology", "browser", "astronomy"]
categories = ["science", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xalen-time = { version = "0.6.0", path = "../xalen-time" }
xalen-coords = { version = "0.6.0", path = "../xalen-coords" }
xalen-ephem = { version = "0.6.0", path = "../xalen-ephem", default-features = false }
xalen-houses = { version = "0.6.0", path = "../xalen-houses" }
xalen-ayanamsa = { version = "0.6.0", path = "../xalen-ayanamsa" }
xalen-vedic = { version = "0.6.0", path = "../xalen-vedic" }
xalen-western = { version = "0.6.0", path = "../xalen-western", default-features = false }
xalen-stars = { version = "0.6.0", path = "../xalen-stars", default-features = false }
serde.workspace = true
serde_json = "1"

[features]
# Default-on passthrough for the non-commercial Hipparcos fixed-star catalog.
# Commercial builds (`--no-default-features`) link none of it.
default = ["hip-catalog"]
hip-catalog = ["xalen-stars/hip-catalog", "xalen-ephem/hip-catalog", "xalen-western/hip-catalog"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
