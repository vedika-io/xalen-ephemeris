[package]
name = "xalen-stars"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fixed star catalog (9,096 Bright Star Catalogue stars) with precession-corrected positions for XALEN Ephemeris"
keywords = ["fixed-stars", "star-catalog", "precession", "astronomy", "astrology"]
categories = ["science", "mathematics"]

[dependencies]
xalen-time = { version = "0.6.0", path = "../xalen-time" }
xalen-coords = { version = "0.6.0", path = "../xalen-coords" }
serde.workspace = true

[features]
# `bright-catalog` (default-on) embeds the 9,096-star Bright Star Catalogue
# list (`BRIGHT_CATALOG`) and backs `find_by_name` with it. It is a size switch
# only: the data carries no licence restriction beyond attribution. With it off,
# only the 108 curated stars are available.
default = ["bright-catalog"]
bright-catalog = []

[dev-dependencies]
xalen-star-anchors = { version = "0.6.0", path = "../xalen-star-anchors" }

[lints]
workspace = true
