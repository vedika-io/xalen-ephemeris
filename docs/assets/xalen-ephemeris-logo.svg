<?xml version="1.0" encoding="UTF-8"?>
<!-- The XALEN Ephemeris logo: a vector tracing of the official PNG,
     docs/assets/xalen-ephemeris-logo.png, which remains the source of truth.
     Traced on a transparent background (the PNG has a white one) so it reads on
     light and dark pages. The XALEN name and logo are trademarks; see TRADEMARK.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" role="img" aria-labelledby="t">
  <title id="t">XALEN Ephemeris</title>
  <defs>
    <mask id="hole">
      <rect width="100" height="100" fill="white"/>
      <circle cx="50" cy="50" r="1.9" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#FB923C" stroke-width="2"/>
  <g mask="url(#hole)">
    <line x1="28" y1="28" x2="72" y2="72" stroke="#FB923C" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <line x1="72" y1="28" x2="28" y2="72" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/>
    <polygon points="72,28 62,27 71,37" fill="#FB923C"/>
    <path d="M28 28 C48 38, 62 52, 72 72" stroke="#FB923C" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="50" cy="50" r="3" fill="none" stroke="#FB923C" stroke-width="2.2"/>
</svg>
