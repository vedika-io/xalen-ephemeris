<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="456" viewBox="0 0 800 456" role="img" aria-labelledby="t d">
<title id="t">Accuracy of the analytical engine</title>
<desc id="d">Measured error per body in arcseconds on a log scale, from docs/ACCURACY.md: Sun 0.21, Mercury to Saturn at most 0.76, Uranus 1.78, Neptune 2.53, Pluto about 3.2 arcseconds vs JPL DE440; Moon max about 12, RMS about 2.8 arcseconds vs pyswisseph.</desc>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<text x="24" y="30" fill="#e6edf3" font-size="18" font-weight="700">Accuracy with no data files (analytical engine)</text>
<text x="24" y="52" fill="#9198a1" font-size="13">Error in arcseconds, log scale. Load the DE440 kernel for sub-arcsecond Sun, Moon and planets.</text>
<line x1="170" y1="80" x2="170" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="170" y="374" fill="#9198a1" font-size="12" text-anchor="middle">0.1″</text>
<line x1="247.2" y1="80" x2="247.2" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="247.2" y="374" fill="#9198a1" font-size="12" text-anchor="middle">0.2″</text>
<line x1="349.2" y1="80" x2="349.2" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="349.2" y="374" fill="#9198a1" font-size="12" text-anchor="middle">0.5″</text>
<line x1="426.4" y1="80" x2="426.4" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="426.4" y="374" fill="#9198a1" font-size="12" text-anchor="middle">1″</text>
<line x1="503.6" y1="80" x2="503.6" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="503.6" y="374" fill="#9198a1" font-size="12" text-anchor="middle">2″</text>
<line x1="605.6" y1="80" x2="605.6" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="605.6" y="374" fill="#9198a1" font-size="12" text-anchor="middle">5″</text>
<line x1="682.8" y1="80" x2="682.8" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="682.8" y="374" fill="#9198a1" font-size="12" text-anchor="middle">10″</text>
<line x1="760" y1="80" x2="760" y2="356" stroke="#3d444d" stroke-width="1"/>
<text x="760" y="374" fill="#9198a1" font-size="12" text-anchor="middle">20″</text>
<line x1="426.4" y1="74" x2="426.4" y2="356" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="432.4" y="72" fill="#e6edf3" font-size="12" font-weight="700">1 arcsecond</text>
<text x="158" y="103" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Sun</text>
<rect x="170" y="88" width="82.6" height="22" rx="3" fill="#4493f8" opacity="0.9"/>
<text x="260.6" y="100" fill="#e6edf3" font-size="13" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#0d1117" stroke-width="4">0.21″</text>
<text x="170" y="122" fill="#9198a1" font-size="10.5">vs JPL DE440</text>
<text x="158" y="149" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Mercury – Saturn</text>
<rect x="170" y="134" width="225.8" height="22" rx="3" fill="#4493f8" opacity="0.9"/>
<text x="403.8" y="146" fill="#e6edf3" font-size="13" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#0d1117" stroke-width="4">≤ 0.76″</text>
<text x="170" y="168" fill="#9198a1" font-size="10.5">vs JPL DE440</text>
<text x="158" y="195" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Uranus</text>
<rect x="170" y="180" width="320.6" height="22" rx="3" fill="#4493f8" opacity="0.9"/>
<text x="498.6" y="192" fill="#e6edf3" font-size="13" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#0d1117" stroke-width="4">1.78″</text>
<text x="170" y="214" fill="#9198a1" font-size="10.5">vs JPL DE440</text>
<text x="158" y="241" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Neptune</text>
<rect x="170" y="226" width="359.8" height="22" rx="3" fill="#4493f8" opacity="0.9"/>
<text x="537.8" y="238" fill="#e6edf3" font-size="13" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#0d1117" stroke-width="4">2.53″</text>
<text x="170" y="260" fill="#9198a1" font-size="10.5">vs JPL DE440</text>
<text x="158" y="287" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Pluto</text>
<rect x="170" y="272" width="385.9" height="22" rx="3" fill="#4493f8" opacity="0.9"/>
<text x="563.9" y="284" fill="#e6edf3" font-size="13" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#0d1117" stroke-width="4">~3.2″</text>
<text x="170" y="306" fill="#9198a1" font-size="10.5">vs JPL DE440, in-window 1885–2099</text>
<text x="158" y="333" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="end">Moon</text>
<rect x="170" y="318" width="533.1" height="22" rx="3" fill="#9198a1" opacity="0.9"/>
<text x="693.1" y="330" fill="#0d1117" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle">max ~12″, RMS ~2.8″</text>
<text x="170" y="352" fill="#9198a1" font-size="10.5">vs pyswisseph, AD 1600–2100</text>
<text x="24" y="422" fill="#9198a1" font-size="11.5">Source: docs/ACCURACY.md, Planetary Position Accuracy: the reproducible 20,000-chart figures vs JPL DE440</text>
<text x="24" y="440" fill="#9198a1" font-size="11.5">(cargo test -p xalen-ephem --test accuracy_vs_de440); the Moon vs pyswisseph 2.10.03, AD 1600–2100.</text>
</g>
</svg>
